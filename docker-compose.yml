version: '3.8'

services:
  # ============================================
  # VNCSSD Server (NestJS)
  # ============================================
  server:
    build:
      context: ./vncssd-server
      dockerfile: Dockerfile
    container_name: vncssd-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://vncssd:vncssd_password@postgres:5432/vncssd?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change-this-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - NODE_JWT_SECRET=${NODE_JWT_SECRET:-change-this-node-secret}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_PRIVATE_KEY_PATH=/app/firebase-service-account.json
      - SERVER_VERSION=1.0.0
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vncssd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/status/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: vncssd-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vncssd
      - POSTGRES_PASSWORD=vncssd_password
      - POSTGRES_DB=vncssd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vncssd-server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - vncssd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vncssd -d vncssd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: vncssd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - vncssd-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Adminer (Database Management - Optional)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: vncssd-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - vncssd-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vncssd-network:
    driver: bridge
