# VNCSSDetector Web Service - Nginx Configuration (HTTP only for testing)
# For production, use the full nginx.conf with SSL

upstream vncssd_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # Logging
    access_log /var/log/nginx/vncssd-access.log;
    error_log /var/log/nginx/vncssd-error.log;
    
    # Max upload size
    client_max_body_size 500M;
    
    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    
    # Frontend static files
    location / {
        root /opt/vncssd-web/frontend;
        try_files $uri $uri/ /index.html;
    }
    
    # API endpoints
    location /api/ {
        proxy_pass http://vncssd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket
    location /ws/ {
        proxy_pass http://vncssd_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    
    # API docs
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://vncssd_backend;
    }
}
